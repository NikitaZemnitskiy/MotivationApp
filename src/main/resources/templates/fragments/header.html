<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
</head>
<body>
<!-- Фрагмент хедера -->
<th:block th:fragment="headerFragment">
    <header class="bg-white shadow p-4">
        <div class="flex justify-between items-center">
            <!-- Имя -->
            <h1 class="text-2xl font-bold text-purple-700" th:text="${user.displayName}">Name</h1>

            <!-- Навигация -->
            <nav class="flex space-x-6">
                <a th:href="@{/{username}(username=${user.username})}"
                   class="nav-link text-purple-700 font-semibold hover:text-yellow-500 transition">
                    🎯 Задания
                </a>
                <a th:href="@{/history/{username}(username=${user.username})}"
                   class="nav-link text-purple-700 font-semibold hover:text-yellow-500 transition">
                    📜 История
                </a>
                <a th:href="@{/shop/{username}(username=${user.username})}"
                   class="nav-link text-purple-700 font-semibold hover:text-yellow-500 transition">
                    🏪 Магазин
                </a>
                <a th:href="@{/roulette/{username}(username=${user.username})}"
                   class="nav-link text-purple-700 font-semibold hover:text-yellow-500 transition">
                    🎰 Рулетка
                </a>
                <a th:href="@{/prediction/{username}(username=${user.username})}"
                   class="nav-link text-purple-700 font-semibold hover:text-yellow-500 transition">
                    🔮 Предсказания
                </a>
            </nav>

            <!-- Баланс -->
            <span class="text-lg font-semibold text-gray-700">
                Баланс: <span class="text-green-600" th:text="${user.balance}">0</span> Бусёинов
            </span>
        </div>
    </header>

    <script>
        // Подсветка активной ссылки
        document.addEventListener("DOMContentLoaded", () => {
            const currentPath = window.location.pathname;
            document.querySelectorAll("nav .nav-link").forEach(link => {
                if (currentPath.startsWith(link.getAttribute("href"))) {
                    link.classList.remove("text-purple-700");
                    link.classList.add("text-yellow-500", "font-bold");
                }
            });
        });
    </script>
</th:block>
</body>
</html>
